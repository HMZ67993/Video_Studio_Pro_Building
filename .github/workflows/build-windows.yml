# Builds the single-file Windows EXE with Nuitka on GitHub's Windows runner.
# Trigger: push a tag like v1.0.0, or run manually from the Actions tab.
# No secrets are needed. Code signing and the license keys are NOT part of CI (do those locally).
name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      include_ai:
        description: "Include AI captions (Whisper) and person cutout (ONNX). Much bigger EXE and slower build; AI imports are verified in the built EXE."
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed only to attach the EXE to a GitHub Release on tag pushes

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ai.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          if ("${{ inputs.include_ai }}" -eq "true") {
            python -m pip install -r requirements-ai.txt
            python -c "import faster_whisper, ctranslate2, onnxruntime; print('AI imports OK')"
            if ($LASTEXITCODE -ne 0) { throw "AI dependencies failed to import" }
          }

      - name: Unit tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = python tools/print_version.py
          $f = python tools/print_version.py --four
          "version=$v" >> $env:GITHUB_OUTPUT
          "file_version=$f" >> $env:GITHUB_OUTPUT

      - name: Cache Nuitka downloads
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka
          key: nuitka-${{ runner.os }}-py312-${{ hashFiles('requirements.txt', 'requirements-ai.txt') }}

      - name: Build single-file EXE (Nuitka)
        shell: pwsh
        run: |
          $ai = @()
          if ("${{ inputs.include_ai }}" -eq "true") {
            $ai = @("--include-package=faster_whisper", "--include-package=ctranslate2", "--include-package=onnxruntime", "--include-package=tokenizers", "--include-package=av", "--include-package=huggingface_hub", "--include-package=tqdm", "--include-package-data=faster_whisper", "--include-package-data=ctranslate2", "--include-package-data=onnxruntime", "--include-package-data=av")
          }
          $icon = @()
          if (Test-Path icon.ico) { $icon = @("--windows-icon-from-ico=icon.ico", "--include-data-files=icon.ico=icon.ico") }
          python -m nuitka `
            --onefile `
            --enable-plugin=pyqt6 `
            --include-qt-plugins=sensible,multimedia `
            --windows-console-mode=disable `
            --output-dir=build `
            --output-filename=HMZVideoStudioPro.exe `
            --company-name="HMZ-Bytes" `
            --product-name="HMZ Video Studio Pro" `
            --file-description="HMZ Video Studio Pro" `
            --file-version=${{ steps.ver.outputs.file_version }} `
            --product-version=${{ steps.ver.outputs.file_version }} `
            --onefile-tempdir-spec="{CACHE_DIR}/HMZ-Bytes/VideoStudioPro/{VERSION}" `
            --include-module=video_studio_guide_more `
            --include-module=video_studio_record `
            --include-module=video_studio_home `
            --include-module=video_studio_recent `
            --include-package=arabic_reshaper `
            --include-package=bidi `
            --nofollow-import-to=tests `
            --nofollow-import-to=tools `
            --nofollow-import-to=pytest `
            --nofollow-import-to=tkinter `
            --msvc=latest `
            --assume-yes-for-downloads `
            --remove-output `
            @ai `
            @icon `
            video_studio.py
          if ($LASTEXITCODE -ne 0) { throw "Nuitka failed" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/HMZVideoStudioPro.exe dist/HMZVideoStudioPro.exe

      - name: Self-test the built EXE
        shell: pwsh
        run: |
          $out = Join-Path $PWD "build/selftest.txt"
          $selfTestArgs = @("--selftest", "--selftest-out", $out)
          if ("${{ inputs.include_ai }}" -eq "true") { $selfTestArgs = @("--selftest", "--require-ai", "--selftest-out", $out) }
          $p = Start-Process -FilePath "dist/HMZVideoStudioPro.exe" -ArgumentList $selfTestArgs -Wait -PassThru
          if (-not (Test-Path $out)) { throw "EXE produced no self-test result (failed to start?)" }
          Get-Content $out
          if (-not (Select-String -Path $out -Pattern "^RESULT PASS" -Quiet)) { throw "Self-test failed" }

      - name: SHA-256
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/HMZVideoStudioPro.exe -Algorithm SHA256).Hash.ToLower()
          "$h  HMZVideoStudioPro.exe" | Out-File -Encoding ascii dist/SHA256.txt
          Get-Content dist/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: HMZVideoStudioPro-${{ steps.ver.outputs.version }}-${{ inputs.include_ai && 'AI' || 'Standard' }}-windows
          path: |
            dist/HMZVideoStudioPro.exe
            dist/SHA256.txt
          if-no-files-found: error

      - name: Attach to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/HMZVideoStudioPro.exe
            dist/SHA256.txt
