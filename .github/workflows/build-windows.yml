# Builds the single-file Windows EXE with Nuitka on GitHub's Windows runner.
# Trigger: push a tag like v1.0.0, or run manually from the Actions tab.
# No secrets are needed. Code signing and the license keys are NOT part of CI (do those locally).
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed only to attach the EXE to a GitHub Release on tag pushes

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ai.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Unit tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = python tools/print_version.py
          $f = python tools/print_version.py --four
          "version=$v" >> $env:GITHUB_OUTPUT
          "file_version=$f" >> $env:GITHUB_OUTPUT

      - name: Cache Nuitka downloads
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka
          key: nuitka-${{ runner.os }}-py312-${{ hashFiles('requirements.txt', 'requirements-ai.txt') }}

      - name: Build single-file EXE (Nuitka)
        shell: pwsh
        run: |
          # The EXE stays lean. Native AI wheels are shipped as a separate on-demand runtime ZIP.
          @{ repository = $env:GITHUB_REPOSITORY } | ConvertTo-Json | Set-Content -Encoding utf8 hmz_ai_config.json
          $icon = @()
          if (Test-Path icon.ico) { $icon = @("--windows-icon-from-ico=icon.ico", "--include-data-files=icon.ico=icon.ico") }
          python -m nuitka `
            --onefile `
            --enable-plugin=pyqt6 `
            --include-qt-plugins=sensible,multimedia `
            --windows-console-mode=disable `
            --output-dir=build `
            --output-filename=HMZVideoStudioPro.exe `
            --company-name="HMZ-Bytes" `
            --product-name="HMZ Video Studio Pro" `
            --file-description="HMZ Video Studio Pro" `
            --file-version=${{ steps.ver.outputs.file_version }} `
            --product-version=${{ steps.ver.outputs.file_version }} `
            --onefile-tempdir-spec="{CACHE_DIR}/HMZ-Bytes/VideoStudioPro/{VERSION}" `
            --include-module=video_studio_guide_more `
            --include-module=video_studio_record `
            --include-module=video_studio_home `
            --include-module=video_studio_recent `
            --include-module=video_studio_ai_runtime `
            --include-package=arabic_reshaper `
            --include-package=bidi `
            --nofollow-import-to=tests `
            --nofollow-import-to=tools `
            --nofollow-import-to=pytest `
            --nofollow-import-to=tkinter `
            --msvc=latest `
            --assume-yes-for-downloads `
            --remove-output `
            --include-data-files=hmz_ai_config.json=hmz_ai_config.json `
            @icon `
            video_studio.py
          if ($LASTEXITCODE -ne 0) { throw "Nuitka failed" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/HMZVideoStudioPro.exe dist/HMZVideoStudioPro.exe

      - name: Build optional AI runtime bundle
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --target build/ai_runtime -r requirements-ai.txt
          Compress-Archive -Path build/ai_runtime/* -DestinationPath dist/HMZ_AI_Runtime_Windows_Py312.zip -CompressionLevel Optimal
          if (-not (Test-Path dist/HMZ_AI_Runtime_Windows_Py312.zip)) { throw "AI runtime bundle was not created" }
          $runtimeHash = (Get-FileHash dist/HMZ_AI_Runtime_Windows_Py312.zip -Algorithm SHA256).Hash.ToLower()
          "$runtimeHash  HMZ_AI_Runtime_Windows_Py312.zip" | Out-File -Encoding ascii dist/HMZ_AI_Runtime_Windows_Py312.sha256

      - name: Self-test the built EXE
        shell: pwsh
        run: |
          $out = Join-Path $PWD "build/selftest.txt"
          $selfTestArgs = @("--selftest", "--selftest-out", $out)
          $p = Start-Process -FilePath "dist/HMZVideoStudioPro.exe" -ArgumentList $selfTestArgs -Wait -PassThru
          if (-not (Test-Path $out)) { throw "EXE produced no self-test result (failed to start?)" }
          Get-Content $out
          if (-not (Select-String -Path $out -Pattern "^RESULT PASS" -Quiet)) { throw "Self-test failed" }

      - name: SHA-256
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/HMZVideoStudioPro.exe -Algorithm SHA256).Hash.ToLower()
          "$h  HMZVideoStudioPro.exe" | Out-File -Encoding ascii dist/SHA256.txt
          Get-Content dist/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: HMZVideoStudioPro-${{ steps.ver.outputs.version }}-windows
          path: |
            dist/HMZVideoStudioPro.exe
            dist/HMZ_AI_Runtime_Windows_Py312.zip
            dist/HMZ_AI_Runtime_Windows_Py312.sha256
            dist/SHA256.txt
          if-no-files-found: error

      - name: Attach to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/HMZVideoStudioPro.exe
            dist/HMZ_AI_Runtime_Windows_Py312.zip
            dist/HMZ_AI_Runtime_Windows_Py312.sha256
            dist/SHA256.txt

      - name: Publish on-demand AI runtime release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ai-runtime
          name: HMZ Video Studio Pro - AI Runtime
          prerelease: true
          make_latest: false
          files: |
            dist/HMZ_AI_Runtime_Windows_Py312.zip
            dist/HMZ_AI_Runtime_Windows_Py312.sha256
